<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>开个游戏公司 V2.0</title>
<style>
/* ============ 基础 ============ */
:root{--ink:#1d2a3d;--paper:#f5f0e3;--card:#fffaf0;--line:#cfbd98;--blue:#315d8e;--gold:#d6a94b;--aqua:#3f9e7c;--orange:#e07a3f;--pink:#d8607a;--muted:#6f6a5c;--navy:#1c2d4b;
--c-code:#4c89e9;--c-art:#ed7b8a;--c-music:#e0a23e;--c-idea:#52af9f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit}
button{min-height:40px;cursor:pointer;border:1px solid #d4c7a8;border-radius:8px;padding:8px 12px;background:#efe6d2;color:var(--ink);font-weight:800;box-shadow:0 2px 0 #c9b98f}
button:hover{filter:brightness(.97)}button:active{transform:translateY(1px);box-shadow:0 1px 0 #c9b98f}
button:disabled{opacity:.42;cursor:not-allowed;transform:none}
.primary{background:var(--blue);color:#fff;border-color:#264a72;box-shadow:0 2px 0 #1d3a5c}
.orange{background:var(--orange);color:#fff;border-color:#b45f2c;box-shadow:0 2px 0 #9c4f21}
.gold{background:var(--gold);color:#3a2a08;border-color:#b78c33;box-shadow:0 2px 0 #a37a28}
.danger{background:#fff0f1;color:#c33d59;border-color:#e6b9c1}
.ghost{background:transparent;border-color:transparent;box-shadow:none}
.hidden{display:none!important}
small{font-size:12px}
h2,h3{margin:0 0 8px}h2{font-size:16px}h3{font-size:14px}
.tag{display:inline-block;background:#efe6d2;color:#5d5340;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:800;vertical-align:middle}
.tag.blue{background:#e1eaf5;color:#2b4d78}.tag.gold{background:#fff0bd;color:#7a5510}.tag.red{background:#ffe3e6;color:#a53548}.tag.green{background:#dff2e8;color:#2f6f55}
.muted{color:var(--muted)}
.hint{background:#f5ecd7;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:7px;padding:9px 11px;font-size:12px;line-height:1.55;margin:10px 0}
.empty{text-align:center;color:var(--muted);padding:20px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.split{display:flex;align-items:center;gap:8px}.split .grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bar{height:10px;background:#e8dfc6;border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),#7dd3b8);border-radius:99px;transition:width .5s}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;box-shadow:0 4px 0 #7d694422}
.section{padding:14px;margin-bottom:12px}
.record{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;background:#fffdf7}
.record p{font-size:12px;color:var(--muted);margin:5px 0}
.choice{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fffdf7}
.choice h3{margin:0 0 4px}.choice p{margin:0 0 8px;font-size:12px;color:var(--muted)}
.choice.dim{opacity:.5}
.scene-text{background:#203c70;color:#fff;border-radius:10px;padding:11px;font-size:12px;line-height:1.55}.scene-text b{color:#ffe094}
.grid-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.stat{padding:10px 12px;min-height:70px}.stat label{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:19px;margin:5px 0 2px;white-space:nowrap}.stat small{color:var(--aqua)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:7px}
.mini div{border-radius:9px;background:#f3ecda;padding:8px;color:var(--muted);font-size:11px}.mini b{display:block;font-size:16px;color:var(--ink);margin-top:2px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{min-height:36px;padding:6px 10px}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.portfolio{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.rank{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #eadfca;align-items:center}
.rank small{color:var(--muted)}
.hbar{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.hbar div{height:10px;background:#efe6cf;border-radius:6px;overflow:hidden}.hbar div i{display:block;height:100%;background:var(--blue);border-radius:6px}
.hbar.me div i{background:var(--gold)}
/* ============ 顶栏与布局 ============ */
.app{max-width:1440px;margin:auto;padding:12px}
.top{display:flex;align-items:center;gap:14px;padding:9px 14px;border:2px solid #9cb0c7;border-bottom:4px solid #718aa6;border-radius:10px;background:#fff;box-shadow:0 4px 0 #26365720;position:sticky;top:7px;z-index:4;min-height:62px}
.brand{display:flex;gap:9px;align-items:center;min-width:200px}
.logo{width:38px;height:38px;border-radius:8px;background:#eb7e63;box-shadow:inset -4px -4px 0 #d95f65;display:grid;place-items:center;color:#fff;font-size:20px}
.brand b{display:block;font-size:16px}.brand small{display:block;color:var(--muted)}
.clock{font-weight:900;color:var(--blue);white-space:nowrap}
.trend{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.speed{display:flex;flex:none;gap:4px;align-items:center}
.speed:before{content:attr(data-state);font-size:10px;color:var(--muted);white-space:nowrap;margin-right:3px}
.speed button{min-height:36px;padding:6px 9px;min-width:40px}.speed button.active{background:var(--ink);color:#fff;border-color:var(--ink);outline:2px solid #f0c768;outline-offset:1px}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 290px;gap:12px;margin-top:12px}
.side{padding:8px;height:max-content;position:sticky;top:84px}
.nav{display:flex;align-items:center;width:100%;gap:9px;text-align:left;background:transparent;border-color:transparent;box-shadow:none;margin:2px 0}
.nav.active{background:#e9e0c8;border-color:var(--line)}
.nav em{font-style:normal;margin-left:auto;font-size:11px;background:#e7ddc4;color:var(--muted);border-radius:9px;padding:2px 6px}
.side hr{border:0;border-top:1px solid var(--line);margin:9px 0}
.feed{padding:12px}.feed h3{margin:0 0 8px}
.feedlist{max-height:calc(100vh - 220px);overflow:auto}
.news{border-bottom:1px solid #eadfca;padding:8px 0;line-height:1.42;font-size:12px}.news:last-child{border:0}.news b{display:block;color:#294f91}.news small{color:var(--muted);font-size:11px}
.warning{background:#fff9df;border-color:#f2dfa3;padding:12px;margin-bottom:10px}.warning h3{margin:0 0 7px}.warning p{margin:0 0 9px;line-height:1.55;font-size:12px}
.bottomnav{display:none}
/* ============ 总览页 ============ */
.home{display:grid;grid-template-columns:500px minmax(0,1fr);gap:12px;align-items:start}
.office-card{width:500px;max-width:100%;padding:0;overflow:hidden;background:var(--navy);border-color:#213c66}
.office-head{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:#fff;color:var(--ink)}
.office-head b{font-size:15px}.office-head small{color:var(--muted)}
#officeCanvas{display:block;width:100%;height:auto;aspect-ratio:480/280;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;background:#ead5aa}
.scene-note{padding:8px 13px;background:#1b3155;color:#dbeaff;font-size:12px;border-top:3px solid var(--gold)}.scene-note b{color:#ffe49a}
.dash{display:grid;gap:10px}
.panel{padding:12px}
.ops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.ops button{min-width:0;min-height:44px;font-size:12px;padding:6px 4px;white-space:nowrap}
/* 项目卡 */
.pcard{border:2px solid #c9b580;border-radius:10px;padding:11px;margin:8px 0;background:linear-gradient(180deg,#fffdf7,#fff8e9)}
.pcard .head{display:flex;justify-content:space-between;align-items:center;gap:8px}.pcard .head h3{margin:0}.pcard .head b{color:var(--blue)}
.pcard small{color:var(--muted)}
.qbars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.qbar{background:#f3ecda;border-radius:8px;padding:6px 7px;font-size:11px;color:var(--muted)}
.qbar b{display:block;font-size:15px;color:var(--ink);line-height:1.1}
.qbar i{display:block;height:6px;border-radius:4px;background:#e2d8bf;margin-top:4px;overflow:hidden;position:relative}
.qbar i:after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:var(--c);border-radius:4px;transition:width .5s}
.qbar.code{--c:var(--c-code)}.qbar.art{--c:var(--c-art)}.qbar.music{--c:var(--c-music)}.qbar.idea{--c:var(--c-idea)}
.devlog{background:#f7f2e5;border-radius:8px;padding:7px 9px;margin-top:8px;font-size:11px;color:#5d5340;line-height:1.5;max-height:82px;overflow:auto}
.devlog span{display:block}.devlog span:first-child{color:var(--ink);font-weight:800}
.pcard .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pcard .btns button{min-height:36px;padding:6px 10px;font-size:12px}
/* 员工 */
.person{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fffdf7}
.avatar{height:42px;width:42px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:18px;flex:none;box-shadow:inset -3px -3px 0 #0002;font-weight:900}
.person main{min-width:0;flex:1}.person h3{margin:0}.person p{margin:3px 0;color:var(--muted);font-size:12px;line-height:1.4}
.person aside{text-align:right;color:var(--muted);font-size:12px;flex:none}
.energy{height:5px;background:#e5dcc4;border-radius:10px;overflow:hidden;margin:4px 0}.energy i{display:block;height:100%;background:var(--aqua)}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.statline span{font-size:11px;background:#f3ecda;border-radius:6px;padding:3px 5px;color:var(--muted)}.statline b{color:var(--ink)}
.person-card{display:grid;grid-template-columns:68px 1fr;gap:12px}
.portrait{height:68px;width:68px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:28px;box-shadow:inset -4px -4px 0 #0002}
.profile-line{font-size:12px;line-height:1.65;color:var(--muted)}.profile-line b{color:var(--ink)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pick{border:1px solid var(--line);padding:8px;border-radius:10px;display:flex;gap:7px;align-items:center;font-size:12px;background:#fffdf7;cursor:pointer}
.pick.dim{opacity:.45}.pick small{display:block;color:var(--muted)}
.job{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;background:#fffdf7}.job h3{margin:0 0 4px}.job p{color:var(--muted);font-size:12px;margin:4px 0}
.facility-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.facility{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fffdf7}.facility b{display:block}.facility small{display:block;color:var(--muted);line-height:1.4;margin:3px 0 7px}
.inv-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #dfd1b5}.inv-row h3{margin:0 0 4px}.inv-row p{margin:0;color:var(--muted);font-size:12px}
/* 立项对话框 */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;font-weight:900;color:#51627c;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #d4c7a8;border-radius:8px;padding:9px;background:#fff;color:var(--ink)}
.combo-line{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:12px}
.combo-line b{font-size:14px}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}.stars.bad{color:#c05050}.stars.unknown{color:#999}
.dir{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.dir div{background:#f3ecda;border-radius:9px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.dir b{display:block;font-size:20px;color:var(--ink);line-height:1.1;margin:3px 0}
.dir .pm{display:flex;justify-content:center;gap:4px}.dir .pm button{min-height:28px;min-width:32px;padding:2px 6px;font-size:14px;line-height:1}
.dir i{display:block;height:5px;border-radius:4px;background:var(--c);margin-top:6px;opacity:.85}
.dir .code{--c:var(--c-code)}.dir .art{--c:var(--c-art)}.dir .music{--c:var(--c-music)}.dir .idea{--c:var(--c-idea)}
.presets{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.presets button{min-height:30px;padding:3px 9px;font-size:11px}
.weights{font-size:11px;color:var(--muted);margin-top:6px}
.weights b{color:var(--ink)}
/* 图鉴 */
.codex{overflow-x:auto}
.codex table{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:560px}
.codex th{font-weight:800;color:var(--muted);padding:4px;white-space:nowrap}.codex th small{display:block;font-weight:400;font-size:10px}
.codex td{background:#f3ecda;border-radius:6px;text-align:center;padding:6px 3px;min-width:58px;height:40px;cursor:default}
.codex td.s{background:#ffe9a8}.codex td.a{background:#dff2e8}.codex td.c{background:#ffe0e0}.codex td.b{background:#eee8d8}
.codex td small{display:block;color:var(--muted);font-size:10px}
.mastery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:7px}
.mastery div{background:#fffdf7;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}
.mastery i{display:block;height:6px;background:#e8dfc6;border-radius:4px;margin-top:5px;overflow:hidden}.mastery i:after{content:'';display:block;height:100%;width:var(--w);background:var(--gold)}
/* 评测杂志 */
.mag{background:#1a1d2b;color:#f2ead9;border-radius:12px;padding:16px;position:relative;overflow:hidden}
.mag:before{content:'REVIEW';position:absolute;right:-6px;top:-16px;font-size:74px;font-weight:1000;color:#ffffff0a;letter-spacing:4px}
.mag .mh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid #d6a94b;padding-bottom:9px;margin-bottom:12px}
.mag .mh h1{margin:0;font-size:24px;color:#fff}.mag .mh small{color:#cbbfa4}
.mag .total{text-align:right}.mag .total b{font-size:38px;color:#ffe18a;line-height:1;display:block}.mag .total small{color:#cbbfa4}
.critics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.critic{background:#262a3c;border-radius:10px;padding:10px;text-align:center;opacity:0;transform:translateY(10px);transition:.35s}
.critic.show{opacity:1;transform:none}
.critic .ico{font-size:26px}.critic .nm{font-size:11px;color:#cbbfa4;margin:3px 0}.critic .sc{font-size:30px;font-weight:1000;color:#fff;line-height:1}
.critic .sc.hi{color:#ffd76a}.critic .sc.lo{color:#f08a8a}
.critic .q{font-size:11px;color:#e6dcc7;line-height:1.4;margin-top:6px;min-height:46px}
.hof{margin-top:12px;background:linear-gradient(90deg,#d6a94b,#ffe18a,#d6a94b);color:#3a2a08;font-weight:1000;text-align:center;padding:9px;border-radius:8px;letter-spacing:2px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.reveal-combo{margin-top:10px;background:#2c3149;border-radius:8px;padding:9px;font-size:12px;color:#f2ead9}
.reveal-combo b{color:#ffe18a}
/* 典礼 */
.ceremony{background:#1a1d2b;color:#f2ead9;border-radius:12px;padding:18px;text-align:center}
.ceremony .cat{font-size:13px;letter-spacing:4px;color:#d6a94b;margin-bottom:10px}
.ceremony .noms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ceremony .nom{background:#262a3c;border-radius:9px;padding:9px 6px;font-size:12px;line-height:1.4}.ceremony .nom small{display:block;color:#cbbfa4;font-size:10px}.ceremony .nom.mine{outline:2px solid #d6a94b}
.ceremony .env{background:#d6a94b;color:#3a2a08;border-radius:10px;padding:14px;transform:scale(.6);opacity:0;transition:.5s cubic-bezier(.2,1.4,.5,1)}.ceremony .env.open{transform:none;opacity:1}
.ceremony .env small{display:block;font-size:11px}.ceremony .env b{display:block;font-size:22px;margin:3px 0}.ceremony .env span{font-size:12px}
.ceremony .scene-text{margin-top:12px;opacity:0;transition:.4s .3s}.ceremony .scene-text.show{opacity:1}
@media(max-width:720px){.ceremony .noms{grid-template-columns:1fr}}
/* 报告 */
.reporthero{background:linear-gradient(135deg,#213d76,#3868c9);color:#fff;padding:16px;border-radius:12px}
.reporthero h1{margin:2px 0 5px;font-size:24px}.reporthero .score{font-size:40px;font-weight:900;color:#ffe18a}
.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:11px 0}
.reportgrid div{background:#f4efe0;padding:9px;border-radius:10px;font-size:12px;color:var(--muted)}.reportgrid b{display:block;color:var(--ink);font-size:16px;margin-top:3px}
.quote{border-left:3px solid var(--orange);padding:7px 9px;margin:7px 0;background:#fff8f3;font-size:12px;line-height:1.45}
.chart{width:100%;height:auto;border-radius:10px;border:2px solid #e0d2b2;background:#fffaf0}
.legend{font-size:11px;color:var(--muted);margin:5px 0 0}
.award-row{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #e7d8b8;font-size:13px}
.award-row.win{background:#fff0bd;border:2px solid var(--gold);border-radius:8px;margin:5px 0}
.award-row small{text-align:right;color:var(--muted)}
.grade{font-size:72px;line-height:1;font-weight:1000;color:#d79a35;text-shadow:4px 4px 0 #f4dfa8;text-align:center;margin:10px 0}
.gold-list li{margin:4px 0}
/* ============ 对话框 ============ */
html:has(dialog[open]){overflow:hidden}
dialog{border:0;padding:0;width:min(720px,calc(100% - 24px));max-height:88vh;max-height:88dvh;border-radius:14px;color:var(--ink);box-shadow:0 25px 80px #17243a60;background:var(--card)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#17243a85;backdrop-filter:blur(3px)}
.dhead{display:flex;flex:none;justify-content:space-between;align-items:center;gap:10px;padding:15px 18px 12px;border-bottom:2px solid var(--line)}
.dhead h2{flex:1;min-width:0;font-size:18px;margin:0}.dhead>button{flex:none;min-height:34px;padding:4px 10px}
.dbody{flex:1;min-height:0;padding:14px 18px;overflow:auto;overscroll-behavior:contain}
.dfoot{display:flex;flex:none;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:11px 18px;border-top:2px solid var(--line)}
dialog.wide{width:min(860px,calc(100% - 24px))}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));max-width:calc(100% - 28px);text-align:center;line-height:1.45;transform:translate(-50%,80px);background:#17243a;color:#fff;border-radius:99px;padding:10px 16px;box-shadow:0 10px 30px #0004;transition:.25s;font-size:13px}
.toast.show{transform:translate(-50%,0)}
/* ============ 开始页 ============ */
.start{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 78% 22%,#ffbd76 0,transparent 24%),radial-gradient(circle at 16% 76%,#53cdbd 0,transparent 28%),linear-gradient(135deg,#1d2e5b,#4167c4)}
.startcard{width:min(740px,100%);padding:40px;border-radius:22px;background:#fffaf0f2;box-shadow:0 30px 80px #14235470;position:relative;overflow:hidden}
.startcard:after{content:"✦";position:absolute;right:6%;top:-35px;font-size:190px;color:#3267d815}
.startcard h1{font-size:40px;line-height:1.15;margin:7px 0 12px;position:relative}
.startcard p{max-width:520px;color:#52617a;line-height:1.7;position:relative}
.eyebrow{font-weight:900;letter-spacing:2px;color:var(--orange);position:relative}
.legacy{color:#a6772a;font-weight:800}
/* ============ 响应式 ============ */

}

  for(let k of ['crisis','unlocked','facilities','bonds','audiences','researchUpgrades','investments','corporate','mastery','yearRecords','finYears','combos','items'])s[k]={...f[k],...(raw[k]&&typeof raw[k]==='object'?raw[k]:{})};
  s.mastery.genre=s.mastery.genre||{};s.mastery.theme=s.mastery.theme||{};
  for(let k of ['staff','projects','games','sales','news','loans','ips','postOps','awardHistory','eventHistory','hallOfFame','expoHistory'])if(!Array.isArray(s[k]))s[k]=[];
  if(!Array.isArray(s.rivals)||!s.rivals.length)s.rivals=f.rivals;
  s.rivals.forEach((r,i)=>{let d=RIVALS[i%RIVALS.length];r.specialties=r.specialties||d[3];r.quality=r.quality||6.15+(r.power||1)*1.15;r.tech=r.tech||1+Math.floor(i/2);r.cash=r.cash||600000;r.profit=r.profit||0;r.momentum=r.momentum||0;r.seasonHistory=r.seasonHistory||{};r.games=r.games||[];r.awards=r.awards||0});
  if(!Number.isFinite(s.money))s.money=0;['fame','fans','rp','level','office','year','month','week'].forEach(k=>{if(!Number.isFinite(s[k]))s[k]=f[k]});
  s.staff=s.staff.map(e=>{let b=makeStaff(e.name||'未命名',ROLES[e.role]?e.role:'planner',e.lvl||1),x={...b,...e};x.stats={...b.stats,...(e.stats||{})};x.energy=clamp(Number.isFinite(e.energy)?e.energy:100,0,100);x.creativity=clamp(e.creativity||0,-30,8);x.works=Array.isArray(e.works)?e.works:[];x.traitText=TRAIT_TEXT[x.trait]||x.traitText||'';x.color=x.color||ROLE_COLOR[x.role];x.jobs=Array.isArray(e.jobs)?e.jobs:[];return x});
  s.projects=s.projects.map(p=>({...p,phases:p.phases||PHASES,phase:p.phase||0,quality:{code:0,art:0,music:0,idea:0,...(p.quality||{})},direction:p.direction||{code:2,art:2,music:2,idea:2},log:Array.isArray(p.log)?p.log:[],decisions:p.decisions||[],team:p.team||[],bugs:p.bugs||0,progress:p.progress||0,synergy:p.synergy||50,finance:{base:0,platform:0,marketing:0,wages:0,debug:0,events:0,total:0,...(p.finance||{})},publisher:p.publisher||'独立发行',pendingDecision:p.pendingDecision??null,pendingChoices:p.pendingChoices||null}));
  s.games.forEach(g=>{g.quality=g.quality||{code:0,art:0,music:0,idea:0};g.salesHistory=Array.isArray(g.salesHistory)?g.salesHistory:[];g.finance=g.finance||{total:0};g.units=g.units||0;g.netRevenue=g.netRevenue||0;g.gross=g.gross||0;g.profit=Number.isFinite(g.profit)?g.profit:g.netRevenue-g.finance.total;
    if(!g.reviews){let base=Math.round(g.score||6);g.reviews=CRITICS.map(c=>({id:c.id,score:clamp(base+rnd(-1,1),1,10),quote:'（旧版作品，评测记录已按总分补录。）'}));g.total=g.reviews.reduce((a,r)=>a+r.score,0)}
    if(g.genre&&g.theme&&!s.combos[comboKey(g.genre,g.theme)])s.combos[comboKey(g.genre,g.theme)]={tried:1,best:g.score||0,tier:comboTier(g.genre,g.theme)}});
  s.ips.forEach(ip=>{ip.freshness=Number.isFinite(ip.freshness)?ip.freshness:100;ip.rebootPlanned=!!ip.rebootPlanned;ip.entries=ip.entries||0;ip.recognition=ip.recognition||0;ip.expectation=ip.expectation||0;ip.goodwill=ip.goodwill||0;ip.bestScore=ip.bestScore||0;ip.totalUnits=ip.totalUnits||0});
  if(!s.trend||!s.trend.category){S=s;s.trend=newTrend()}
  s.version=VERSION;return s;
}

  if(!S||speed<=0||document.hidden||hasOpenModal())return;
  clockHandle=setTimeout(()=>{clockHandle=null;if(S&&speed>0&&!document.hidden&&!hasOpenModal())advanceWeek();scheduleClock()},Math.max(900,WEEK_MS/speed));
}

function advanceWeek(){
  if(!S||hasOpenModal()||speed===0)return;
  let y=S.year,m0=S.money;
  S.week++;if(S.week>4){S.week=1;S.month++;if(S.month>12){S.month=1;S.year++;annualClose()}}
  if(hasOpenModal()){save();render();return}
  weeklyPayroll();processStaff();processProjects();processOutsource();processSales();processPostOps();processLoans();progressTrend();financialRisk();
  if(!hasOpenModal())maybeExpo();if(!hasOpenModal())maybeEvent();if(!hasOpenModal())maybePoach();
  finYear(y).net+=S.money-m0;
  if(!Number.isFinite(S.money)){S.money=0;addNews('系统修复','资金数据出现异常，已重置为 0。')}
  save();render();
}
function finYear(y){let k=String(y);S.finYears[k]=S.finYears[k]||{income:0,net:0};return S.finYears[k]}

/* ---------- 财务 ---------- */
function weeklyPayroll(){
  let total=0;S.staff.forEach(e=>{let w=e.salary/4;total+=w;S.projects.filter(p=>p.team.includes(e.id)&&!p.paused).forEach(p=>{p.finance.wages+=w;p.finance.total+=w})});S.money-=total;
  if(S.week!==1)return;
  let age=Math.max(0,S.year-START_YEAR),overhead=Math.round((3000+S.staff.length*900+S.projects.length*1500+S.level*2000)*(1+age*.03));
  S.money-=officeDef().rent+overhead;
  let lic=0,names=[];
  S.ips.forEach(ip=>{if(ip.freshness<100)ip.freshness=Math.min(100,ip.freshness+2);else if(ip.freshness>100)ip.freshness=Math.max(100,ip.freshness-1);
    if(ip.recognition>=100&&ip.entries>=2){let v=Math.min(45000,4000+Math.round(ip.recognition*40));lic+=v;names.push(ip.name)}});
  if(lic){S.money+=lic;finYear(S.year).income+=lic}
  addNews('月度财务',`房租 ${money(officeDef().rent)}、运营支出 ${money(overhead)} 已扣除。${lic?`IP 授权收入 ${money(lic)}（${names.join('、')}）。`:''}`);
}
function processLoans(){S.loans.forEach(x=>x.weeks--);S.loans.filter(x=>x.weeks<=0).forEach(x=>{S.money-=x.repay;addNews('贷款到期',`偿还短期贷款 ${money(x.repay)}。`)});S.loans=S.loans.filter(x=>x.weeks>0)}
function financialRisk(){
  if(S.money<0){S.crisis.negativeWeeks++;if(!S.crisis.seen&&!hasOpenModal()){S.crisis.seen=true;showCrisis()}if(S.crisis.negativeWeeks>=10||S.money<=-600000)gameOver()}
  else{S.crisis.negativeWeeks=0;if(S.money>200000)S.crisis.seen=false}
}

function processStaff(){
  let c=S.corporate;c.bonusCooldown=Math.max(0,c.bonusCooldown-1);c.campaignCooldown=Math.max(0,c.campaignCooldown-1);c.eventCooldown=Math.max(0,c.eventCooldown-1);c.poachCooldown=Math.max(0,c.poachCooldown-1);
  S.staff.forEach(e=>{
    if(!e.status){e.energy=clamp(e.energy+18+S.facilities.coffee*4+S.facilities.sofa*2,0,100);e.creativity=clamp(e.creativity+3,-30,8);e.mood='自主学习';return}
    let st=e.status;
    if(st.kind==='rest'){st.weeks--;e.energy=clamp(e.energy+35+S.facilities.sofa*8,0,100);e.creativity=clamp(e.creativity+5,-30,8);e.mood='恢复中';if(st.weeks<=0){e.status=null;e.mood='精神饱满';addNews('休息结束',`${e.name} 恢复了精神。`,e.name)}}
    else if(st.kind==='train'){st.weeks--;e.energy=clamp(e.energy-8,0,100);e.mood='训练中';if(st.weeks<=0){let gain=rnd(4,7)+Math.round(researchBonus('training'));e.stats[st.key]=Math.min(STAT_CAP,e.stats[st.key]+gain);e.xp+=1;e.status=null;e.mood='学有所成';addNews('培训完成',`${e.name} 的${DIM_LABEL[st.key]}能力提升 ${gain} 点。`,e.name)}}
    else if(st.kind==='project')e.mood=e.energy<35?'疲惫赶工':'专注开发';
    else if(st.kind==='outsource')e.mood='外包冲刺';
    else if(st.kind==='maintenance')e.mood='维护旧作';
  });
  let danger=S.staff.find(e=>e.energy<15&&e.status?.kind==='project'&&!e.status.warned);
  if(danger&&!hasOpenModal()){danger.status.warned=true;S.alert={type:'fatigue',staffId:danger.id};pauseForModal();toast(`${danger.name} 体力告急，时间已暂停。`)}
}

/* ---------- 项目开发 ---------- */
function teamOf(p){return p.team.map(staffById).filter(Boolean)}
function projectMods(p){
  let lead=staffById(p.leader),leadBonus=(lead?.specialty==='专家'?.08:0)+(lead?.role==='director'?.10:0),mg=masteryLevel('genre',p.genre),mt=masteryLevel('theme',p.theme);
  return{common:1+(p.synergy||50)/1000+leadBonus+researchBonus('quality')+S.investments.engine*.04+mg*.03+mt*.015,mastery:mg+mt};
}
function memberPower(e,key,p){let career=(e.role==='sound'&&key==='music')||(e.role==='writer'&&key==='idea')?.06:0;return e.stats[key]*effect(e)*(1+traitBonus(e,key,p)+preferenceBonus(e,p)+career)*creativityFactor(e)}
function processProjects(){
  for(let p of S.projects){
    if(p.paused||p.stage==='debug'||p.pendingDecision!=null)continue;
    let phase=p.phases[p.phase],key=PHASE_KEY[phase]||'idea',team=teamOf(p),size=SIZES[p.size]||SIZES.small,mods=projectMods(p);
    if(!team.length){p.paused=true;addNews('项目暂停',`《${p.name}》因没有可用成员而暂停。`,p.name);continue}
    /* 四维产出：本阶段主维度全额，其余维度 25% */
    let gains={code:0,art:0,music:0,idea:0},popups=[];
    team.forEach(e=>{DIMS.forEach(k=>{let share=k===key?1:.25,v=memberPower(e,k,p)*(1+facilityBonus(k))*mods.common*dirMult(p.direction[k])/20*size.quality*share;gains[k]+=v;if(v>=.9)popups.push({staffId:e.id,key:k,v})})});
    DIMS.forEach(k=>p.quality[k]+=gains[k]);
    p.progress+=size.progress;
    spawnPopups(p,popups);
    /* 体力、经验、成长 */
    let coach=team.some(e=>e.trait==='新人教练');
    let producer=team.some(e=>e.role==='producer');team.forEach(e=>{e.energy=clamp(e.energy-rnd(3,5)+(producer?1:0),0,100);e.xp+=coach&&e.lvl<4?2:1;let need=8+e.lvl*3;if(e.xp>=need){e.xp-=need;e.lvl++;DIMS.forEach(k=>e.stats[k]=Math.min(STAT_CAP,e.stats[k]+rnd(1,3)));e.salary=Math.round(e.salary*1.1/100)*100;if(e.lvl>=3&&!e.specialty)e.mood='可选择发展方向';addNews('员工成长',`${e.name} 升至 Lv.${e.lvl}。`,e.name);bubble(e.id,'升级！','#ffe18a')}});
    /* Bug */
    let low=team.some(e=>e.energy<35),safe=team.some(e=>['代码洁癖','细节控','逻辑控'].includes(e.trait)),wild=team.some(e=>e.trait==='怪点子'),bugChance=(low?.40:.15)-(safe?.05:0)+(wild?.03:0)-(team.some(e=>e.role==='engineer')?.08:0);
    if(Math.random()<bugChance){let b=rnd(1,3);p.bugs+=b;devLog(p,`测试发现 ${b} 个 Bug（累计 ${p.bugs}）`);bubble(team[rnd(0,team.length-1)].id,'Bug!','#f08a8a')}
    /* 随机现场事件 */
    if(Math.random()<.08){
      let ev=pick([()=>{p.quality.idea+=6;bubble(pick(team).id,'灵感爆发！','#ffe18a');return'灵感爆发，创意 +6'},()=>{p.bugs+=3;p.progress=Math.max(0,p.progress-8);return'返工暴露 3 个 Bug，进度 -8'},()=>{p.progress+=10;p.synergy=clamp(p.synergy+2,10,95);return'团队默契让进度 +10'}]);
      let msg=ev();p.sceneEvent='idea';devLog(p,msg);addNews('项目现场',`《${p.name}》${msg}。`,p.name);
    }else devLog(p,`${phase}：${DIMS.filter(k=>gains[k]>=.5).map(k=>`${DIM_LABEL[k]} +${gains[k].toFixed(1)}`).join('、')}`);
    /* 阶段推进 */
    if(p.progress>=100){
      p.progress=0;p.phase++;
      if(S.investments.qa&&p.bugs){let cut=Math.min(p.bugs,Math.ceil(S.investments.qa*1.35));p.bugs-=cut;devLog(p,`质量保障消除 ${cut} 个问题`)}
      if(p.phase>=p.phases.length){p.stage='debug';p.bugs+=rnd(3,8);p.sceneEvent='bug';devLog(p,`开发完成，进入调试：${p.bugs} 个 Bug`);addNews('开发完成',`《${p.name}》进入调试，发现 ${p.bugs} 个 Bug。`,p.name);S.alert={type:'debug',projectId:p.id};pauseForModal();toast(`《${p.name}》开发完成，时间已暂停：请在项目卡上调试或发行。`);break}
      addNews('阶段完成',`《${p.name}》进入${p.phases[p.phase]}。`,p.name);devLog(p,`进入${p.phases[p.phase]}`);
      if(DECISIONS[p.phase]){openStageDecision(p);break}
    }
  }
}

/* ---------- 阶段抉择 ---------- */
function openStageDecision(p){
  S.decisionProjectId=p.id;p.pendingDecision=p.phase;p.pendingChoices=p.pendingChoices||shuffle(DECISIONS[p.phase]).slice(0,3);
  let lead=staffById(p.leader);
  openDlg(`《${p.name}》· ${p.phases[p.phase]}抉择`,`<div class="scene-text"><b>${esc(lead?.name||'制作人')}正在征询方向。</b>每次都会从方案池中抽取三个选择。</div>${p.pendingChoices.map((x,i)=>`<div class="choice"><h3>${x[0]}</h3><p>${x[1]}</p><button class="primary" onclick="applyDecision(${i})">采用这个方向</button></div>`).join('')}`,'<button onclick="skipDecision()">暂不决定</button>',{noClose:true,onCancel:skipDecision});
}
function applyDecision(i){
  let p=projectById(S.decisionProjectId),choice=p?.pendingChoices?.[i];if(!p||!choice)return closeDlg();
  let c=choice[2],team=teamOf(p),has=t=>team.some(e=>e.trait===t);
  if(c==='stable'){p.bugs=Math.max(0,p.bugs-(has('逻辑控')||has('代码洁癖')?4:3));p.progress=Math.max(0,p.progress-6)}
  if(c==='rush'){p.progress+=20+(has('速度派')?8:0);p.bugs+=5;team.forEach(e=>e.energy=clamp(e.energy-(e.trait==='速度派'||e.trait==='高压领队'?5:8),0,100))}
  if(c==='refactor'){p.quality.code+=8+(has('架构思维')?4:0);p.finance.events+=20000;p.finance.total+=20000;S.money-=20000}
  if(c==='style'){p.quality.art+=7+(has('色彩控')?4:0);p.bugs=Math.max(0,p.bugs-1)}
  if(c==='effects'){p.quality.art+=11+(has('视觉狂热')?2:0);p.bugs+=3}
  if(c==='budget'){p.finance.events-=15000;p.finance.total=Math.max(0,p.finance.total-15000);S.money+=15000;p.quality.art+=2}
  if(c==='fix'){p.bugs=Math.max(0,p.bugs-(has('细节控')?7:5));p.progress+=5}
  if(c==='content'){p.quality.idea+=6+(has('怪点子')||has('叙事强迫症')?4:0);p.bugs+=2}
  if(c==='ship')p.progress+=15;
  p.decisions.push(choice[0]);p.pendingDecision=null;p.pendingChoices=null;p.sceneEvent=c==='effects'?'idea':c==='rush'?'bug':'focus';devLog(p,`抉择：${choice[0]}`);addNews('关键抉择',`《${p.name}》选择「${choice[0]}」。`,p.name);save();closeDlg();
}
function skipDecision(){let p=projectById(S.decisionProjectId);if(p){p.pendingDecision=null;p.pendingChoices=null;p.sceneEvent='focus'}save();closeDlg()}

/* ---------- 外包 ---------- */
function processOutsource(){

function startPostOp(id,type){let defs={patch:['修复补丁',18000,2],update:['免费更新',36000,3],expansion:['资料片',120000,5]},d=defs[type],g=gameById(id),e=S.staff.find(x=>!x.status);if(!g||!d)return;if(S.postOps.some(x=>x.gameId===id))return toast('这款作品已有维护任务。');if(!e)return toast('没有空闲员工可维护旧作。');if(S.money<d[1])return toast('资金不足。');S.money-=d[1];e.status={kind:'maintenance',weeks:d[2],gameId:id};e.mood=`维护《${g.name}》`;S.postOps.push({gameId:id,type,label:d[0],weeks:d[2],staffId:e.id});addNews('发行后运营',`${e.name} 开始为《${g.name}》执行${d[0]}。`,g.name);save();closeDlg()}
function stopMaintenance(id){let ids=new Set(S.postOps.filter(x=>x.gameId===id).map(x=>x.staffId));S.postOps=S.postOps.filter(x=>x.gameId!==id);S.staff.forEach(e=>{if(ids.has(e.id)&&e.status?.kind==='maintenance')e.status=null});addNews('停止维护','这款旧作的维护团队已释放。');save();closeDlg()}
function startSequel(ipId){closeDlg();openProject(ipId)}
function planReboot(ipId){let ip=S.ips.find(x=>x.id===ipId);if(!ip)return;ip.rebootPlanned=true;addNews('重启企划',`《${ip.name}》系列重启企划启动，下一部续作将获得怀旧关注。`,ip.name);closeDlg();openProject(ipId)}

/* ---------- 招聘 / 培训 / 休息 ---------- */
function openRecruit(){if(S.staff.length>=officeDef().cap)return toast('办公室已满，请先升级。');drawCandidates('local');}
function drawCandidates(ch){
  let cost=ch==='local'?12000:ch==='web'?40000:100000,used=new Set(S.staff.map(x=>x.name)),pool=shuffle(PROFILES.filter(x=>!used.has(x[0])));
  candidates=Array.from({length:3},(_,i)=>{let p=pool[i];let e=p?staffFromProfile(p,ch==='headhunt'?2:1):makeStaff(uniqueName(),pick(Object.keys(ROLES)),ch==='headhunt'?2:1);if(ch==='web')DIMS.forEach(k=>e.stats[k]+=3);return e});
  openDlg('招聘候选人',`<div class="field"><label>招聘渠道</label><select onchange="drawCandidates(this.value)"><option value="local" ${ch==='local'?'selected':''}>本地招聘 · ¥1.2万</option><option value="web" ${ch==='web'?'selected':''}>人才网站 · ¥4万 · 能力略高</option><option value="headhunt" ${ch==='headhunt'?'selected':''}>猎头招聘 · ¥10万 · Lv.2 起步</option></select></div>${candidates.map((e,i)=>`<div class="person"><div class="avatar" style="background:${e.color}">${ROLES[e.role][1]}</div><main><h3>${esc(e.name)} <span class="tag">${ROLES[e.role][0]} Lv.${e.lvl}</span></h3><p>${esc(e.trait)}（${esc(e.traitText)}）<br>偏好 ${esc(e.preference)} · 目标 ${esc(e.goal)}</p><div class="statline">${DIMS.map(k=>`<span>${DIM_LABEL[k]} <b>${e.stats[k]}</b></span>`).join('')}</div></main><aside>月薪 ${money(e.salary)}<br><button class="primary" onclick="hire(${i},${cost})">聘用</button></aside></div>`).join('')}`);
}
function hire(i,cost){let e=candidates[i];if(!e)return;if(S.money<cost)return toast('招聘预算不足。');if(S.staff.length>=officeDef().cap)return toast('办公室没有空位。');if(S.staff.some(x=>x.name===e.name))return toast('候选人姓名重复，请重新招聘。');S.money-=cost;S.staff.push(e);addNews('新成员',`${e.name} 加入团队，担任${ROLES[e.role][0]}。`,e.name);save();closeDlg()}
function openPerson(id){
  let e=staffById(id);if(!e)return;let works=e.works.length?e.works.slice(-4).map(x=>`《${esc(x.name)}》${x.score.toFixed(1)}分`).join('、'):'尚未参与发行作品',proj=e.status?.kind==='project'?projectById(e.status.projectId):null;
  openDlg('员工档案',`<div class="person-card"><div class="portrait" style="background:${e.color}">${ROLES[e.role][1]}</div><div><h2 style="margin:0">${esc(e.name)} <span class="tag ${roleTier(e.role)>=3?'gold':roleTier(e.role)===2?'blue':''}">${roleName(e)} Lv.${e.lvl}</span></h2><div class="profile-line">当前：<b>${esc(e.mood||'空闲')}</b>${proj?`（《${esc(proj.name)}》）`:''} · 体力 <b>${e.energy}</b> · 创作状态 <b>${e.creativity}</b> · 经验 ${e.xp}/${8+e.lvl*3}<br>性格：<b>${esc(e.trait)}</b>（${esc(e.traitText)}）<br>偏好：<b>${esc(e.preference)}</b> · 目标：<b>${esc(e.goal)}</b>${e.goalDone?' <span class="tag green">已达成</span>':''}<br>月薪 ${money(e.salary)}${e.specialty?` · 发展方向：<b>${e.specialty}</b>`:''}</div></div></div>
  <div class="statline" style="margin:10px 0">${DIMS.map(k=>`<span>${DIM_LABEL[k]} <b>${e.stats[k]}</b></span>`).join('')}</div>
  <div class="hint">创作状态：外包会降低，自主学习与休息会恢复；偏好匹配项目时品质产出 +8%。<br>参与作品：${works}${e.proud?`<br>最得意作品：《${esc(e.proud.name)}》（${e.proud.score.toFixed(1)} 分）`:''}</div>
  ${e.lvl>=3&&!e.specialty?`<div class="choice"><h3>选择发展方向</h3><p>达到 Lv.3 后可选一次主方向。</p><button onclick="chooseSpecialty(${e.id},'专家')">领域专家 · 本职 +8，担任制作人时全队 +8%</button> <button onclick="chooseSpecialty(${e.id},'调试手')">调试手 · 程序 +3，调试更高效</button></div>`:''}
  ${careerHtml(e)}<h3>安排</h3><p class="muted" style="font-size:12px">培训耗时 1 周、消耗 8 点体力、¥25,000；休息一周恢复 35 点体力。培训或休息时不能参与项目和外包。</p>
  <div class="actions">${DIMS.map(k=>`<button ${e.status?'disabled':''} onclick="scheduleTraining(${e.id},'${k}')">${DIM_LABEL[k]}培训</button>`).join('')}<button class="orange" ${e.status?'disabled':''} onclick="scheduleRest(${e.id})">休息一周</button><button onclick="openItemPicker('staff',${e.id})">使用道具</button>${S.staff.length>1?`<button class="danger" onclick="fireStaff(${e.id})">解约</button>`:''}</div>`);
}
function chooseSpecialty(id,x){let e=staffById(id);if(!e||e.specialty)return;e.specialty=x;if(x==='专家')e.stats[ROLES[e.role][2]]+=8;else e.stats.code+=3;e.mood='找到方向';addNews('发展方向',`${e.name} 选择成为${x}。`,e.name);save();openPerson(id)}
function scheduleTraining(id,key){let e=staffById(id);if(!e||e.status)return toast('该员工当前无法安排。');if(S.money<25000)return toast('培训预算不足。');S.money-=25000;e.status={kind:'train',key,weeks:1};addNews('开始培训',`${e.name} 开始${DIM_LABEL[key]}培训。`,e.name);save();closeDlg()}
function scheduleRest(id){let e=staffById(id);if(!e||e.status)return toast('该员工当前无法安排。');e.status={kind:'rest',weeks:1};e.mood='休息中';addNews('安排休息',`${e.name} 休息一周。`,e.name);save();closeDlg()}
function fireStaff(id){let e=staffById(id);if(!e)return;if(!confirm(`确定与 ${e.name} 解约？需支付 ${money(e.salary*2)} 补偿。`))return;if(S.money<e.salary*2)return toast('资金不足以支付补偿。');S.money-=e.salary*2;removeStaff(e);S.fame=Math.max(0,S.fame-.3);addNews('人员变动',`${e.name} 离开了公司。`,e.name);save();closeDlg()}
function emergencyRest(id){let e=staffById(id);if(!e)return;let p=S.projects.find(x=>x.team.includes(id));if(p){p.paused=true;p.team.forEach(i=>{let m=staffById(i);if(m&&m.status?.kind==='project')m.status=null});addNews('项目暂停',`因 ${e.name} 体力危险，《${p.name}》已暂停。`,p.name)}e.status={kind:'rest',weeks:1};addNews('强制休息',`${e.name} 开始休息一周。`,e.name);dismissAlert()}
function dismissAlert(){S.alert=null;save();resumeAfterModal();render()}

/* ---------- 设施 / 办公室 ---------- */
function openFacilities(){openDlg('公司设施',`<div class="facility-grid">${Object.entries(FACILITIES).map(([id,d])=>{let lv=S.facilities[id],cost=d[3]*(lv+1);return`<div class="facility"><b>${d[0]} <span class="tag">Lv.${lv}/3</span></b><small>${d[2]}。购买后会出现在办公室中。</small><button ${lv>=3||S.money<cost?'disabled':''} onclick="buyFacility('${id}')">${lv>=3?'已满级':`升级 · ${money(cost)}`}</button></div>`}).join('')}</div>`)}
function buyFacility(id){let d=FACILITIES[id],lv=S.facilities[id],cost=d[3]*(lv+1);if(lv>=3||S.money<cost)return;S.money-=cost;S.facilities[id]++;addNews('设施升级',`${d[0]} 升至 Lv.${S.facilities[id]}，办公室焕然一新。`,d[0]);save();openFacilities()}
function moveOffice(){let next=OFFICES[S.office+1];if(!next)return toast('已是最高等级总部。');if(S.level<next.need)return toast(`需要公司等级 ${next.need}。`);if(S.money<next.cost)return toast('搬迁资金不足。');S.money-=next.cost;S.office++;addNews('办公室升级',`团队搬入 ${next.name}。`,next.name);save();render()}

/* ---------- 研发 / 投资 ---------- */
function unlock(kind,val,cost){if(S.rp<cost)return toast('研发点不足。');S.rp-=cost;S.unlocked[kind].push(val);addNews('研发解锁',`解锁新${kind==='genres'?'类型':'题材'}：${val}。`,val);save();render()}
function researchUpgrade(id){let r=S.researchUpgrades,cost=12+r[id]*8;if(r[id]>=5||S.rp<cost)return;S.rp-=cost;r[id]++;addNews('长期研发',`${RESEARCH_UP.find(x=>x[0]===id)[1]}升至 Lv.${r[id]}。`);save();render()}
function investmentCost(id){let d=INVESTMENTS[id];return d.base+d.step*S.investments[id]}
function buyInvestment(id){let d=INVESTMENTS[id],lv=S.investments[id],cost=investmentCost(id);if(lv>=d.max)return toast('该投资已经完成。');if(S.money<cost)return toast('公司资金不足。');S.money-=cost;S.investments[id]=lv+1;addNews('公司投资',`${d.name}升至 Lv.${lv+1}，投入 ${money(cost)}。`,d.name);save();render()}
function teamBonus(){if(S.corporate.bonusCooldown||S.money<90000)return toast('暂时无法发放奖金。');S.money-=90000;S.corporate.bonusCooldown=12;S.staff.forEach(e=>{e.energy=clamp(e.energy+28,0,100);e.creativity=clamp(e.creativity+10,-30,8)});addNews('团队激励','发放季度奖金，团队状态明显恢复。');save();render()}
function brandCampaign(){if(S.corporate.campaignCooldown||S.money<160000)return toast('暂时无法启动品牌战役。');S.money-=160000;S.corporate.campaignCooldown=16;S.corporate.nextLaunchBoost=Math.max(S.corporate.nextLaunchBoost,.18);S.corporate.awardBoost=Math.max(S.corporate.awardBoost,.28);S.fans+=220;addNews('品牌战役','下一款作品将获得额外销售触达，本年度评奖声量上升。');save();render()}
function surveyCombo(){
  let cost=6,unknown=[];GENRES.forEach(g=>THEMES.forEach(t=>{if(!S.combos[comboKey(g,t)]&&S.unlocked.genres.includes(g)&&S.unlocked.themes.includes(t))unknown.push([g,t])}));
  if(!unknown.length)return toast('已解锁的组合都已经验证过了。');if(S.rp<cost)return toast('研发点不足。');S.rp-=cost;let [g,t]=pick(unknown),tier=comboTier(g,t);S.combos[comboKey(g,t)]={tried:0,best:0,tier,surveyed:true};addNews('市场调研',`调研结果：${g} × ${t} 是${COMBO_DEF[tier].label}（${COMBO_DEF[tier].stars}）。`);toast(`调研揭晓：${g} × ${t} = ${COMBO_DEF[tier].stars} ${COMBO_DEF[tier].label}`);save();render();
}

/* ---------- 外包 ---------- */
function openOutsource(filter=''){
  let note=S.outsource?'已有外包正在执行。':S.outsourceCooldown?`团队还需冷却 ${S.outsourceCooldown} 周，暂不能接新外包。`:'外包会占用员工并产生疲劳；连续接单会损失团队创作状态。';
  openDlg('选择外包工作',`<p class="hint">${note}</p>${JOBS.filter(j=>!filter||j.id===filter).map(j=>`<div class="job"><h3>${j.name} <span class="tag">${j.weeks} 周 · ${j.min}—${j.max} 人</span></h3><p>预期收入 ${money(j.minPay)}—${money(j.maxPay)}，看重${DIM_LABEL[j.need]}能力。${j.risk?'达不到质量要求会少结算。':'风险低，适合保底。'}</p><button ${S.outsource||S.outsourceCooldown?'disabled':''} onclick="selectJob('${j.id}')">安排人员</button></div>`).join('')}`);
}
function selectJob(id){let j=JOBS.find(x=>x.id===id),free=S.staff.filter(e=>!e.status);if(free.length<j.min)return toast('可安排的空闲员工不足。');openDlg(`${j.name}：安排人员`,`<div class="hint">选择 ${j.min}—${j.max} 名空闲员工，完成后自动结算。</div><div class="picks">${free.map((e,i)=>`<label class="pick"><input type="checkbox" value="${e.id}" ${i<j.max?'checked':''}>${esc(e.name)}<small>${ROLES[e.role][0]} · ${DIM_LABEL[j.need]} ${e.stats[j.need]} · 体力 ${e.energy}</small></label>`).join('')}</div>`,`<button onclick="openOutsource()">返回</button><button class="primary" onclick="startOutsource('${id}')">确认接单</button>`)}
function startOutsource(id){let j=JOBS.find(x=>x.id===id),ids=[...document.querySelectorAll('#dlgBody input:checked')].map(x=>+x.value);if(ids.length<j.min||ids.length>j.max)return toast(`请选择 ${j.min}—${j.max} 人。`);if(ids.map(staffById).some(e=>!e||e.status))return toast('有成员已经不再空闲。');S.outsource={id,team:ids,weeksLeft:j.weeks,totalWeeks:j.weeks,quality:0};ids.forEach(i=>{staffById(i).status={kind:'outsource',job:id}});addNews('接下外包',`${j.name}开始执行，预计 ${j.weeks} 周后结算。`,j.name);save();closeDlg()}

/* ---------- 系统 ---------- */
function openSystemMenu(){openDlg('游戏管理',`<p class="hint">游戏会每周自动保存到本机浏览器。也可以导出为文件在其他设备导入。</p><div class="actions"><button class="primary" onclick="save();toast('进度已保存。');closeDlg()">保存进度</button><button onclick="exportSave()">导出存档</button><button onclick="openImport()">导入存档</button><button onclick="renameCompany()">公司改名</button><button onclick="closeDlg();showStart()">返回标题</button><button class="danger" onclick="deleteSave()">删除存档</button></div>`)}
function renameCompany(){let n=prompt('新的公司名称',S.company);if(n&&n.trim()){S.company=n.trim().slice(0,12);save();render();closeDlg()}}
function deleteSave(){if(!confirm('确定删除当前存档？此操作不可恢复。'))return;localStorage.removeItem(SAVE_KEY);localStorage.removeItem(LEGACY_KEY);S=null;document.querySelectorAll('dialog[open]').forEach(d=>d.close());modalSpeed=null;showStart()}
function exportSave(){if(S)save();let raw=S?JSON.stringify(S):localStorage.getItem(SAVE_KEY);if(!raw)return toast('没有可导出的存档。');let blob=new Blob([raw],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`开个游戏公司存档_${S?S.year+'年':''}_${Date.now()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('存档已导出为 JSON 文件。')}
function openImport(){openDlg('导入存档',`<p class="hint">选择之前导出的 JSON 存档文件（支持 V1.7 以后的旧版存档），或直接粘贴存档内容。导入会覆盖当前本机存档。</p><input type="file" accept=".json,application/json" onchange="importFile(this)" style="width:100%;border:1px dashed #c9b78d;border-radius:10px;padding:10px;background:#fffaf0"><textarea id="importText" rows="6" style="width:100%;margin-top:9px;border:1px solid #d4c7a8;border-radius:8px;padding:9px;font:12px monospace" placeholder="粘贴存档 JSON..."></textarea>`,`<button onclick="closeDlg()">取消</button><button class="primary" onclick="doImport()">导入并载入</button>`)}
function importFile(input){let f=input.files&&input.files[0];if(!f)return;f.text().then(t=>{byId('importText').value=t;toast('文件已读取，点击「导入并载入」完成导入。')})}
function doImport(){let t=byId('importText').value.trim();if(!t)return toast('请先粘贴或选择存档文件。');let obj;try{obj=JSON.parse(t)}catch{return toast('存档格式无法解析。')}if(!obj||typeof obj!=='object'||!Array.isArray(obj.staff)||!obj.year)return toast('这不是有效的公司存档。');S=normalize(obj);save();document.querySelectorAll('dialog[open]').forEach(d=>d.close());modalSpeed=null;showGame();toast('存档已导入并载入。')}

/* ---------- 新游戏 / 继续 ---------- */
function newGame(){
  document.querySelectorAll('dialog[open]').forEach(d=>d.close());modalSpeed=null;
  let s=fresh(),meta=readMeta(),pool=shuffle(PROFILES),chosen=[],seen=new Set();
  for(let p of pool){if(chosen.length>=3)break;if(!seen.has(p[1])||chosen.length>=2){chosen.push(p);seen.add(p[1])}}
  s.staff=chosen.map(p=>staffFromProfile(p));let start=pick([[980000,'精打细算'],[1180000,'稳健开局'],[1380000,'资金充裕']]);s.money=start[0];s.startingProfile=start[1];s.rp+=Math.min(12,meta.legacy||0);
  S=normalize(s);S.trend=newTrend();addNews('公司开张',`${DEFAULT_COMPANY}以「${start[1]}」方案起步，创始团队是 ${S.staff.map(e=>e.name).join('、')}。${meta.legacy?`继承 ${Math.min(12,meta.legacy)} 点研发经验。`:''}`);
  save();showGame();
  if((meta.legacy||0)>=2)openDlg('创始人传承',`<p class="hint">你带着 ${meta.legacy} 点传承经验再次创业（研发点奖励已自动发放）。可以额外选择一项创始人优势，每局限一项。</p>${PERKS.map(p=>{let ok=meta.legacy>=p[2];return`<div class="choice ${ok?'':'dim'}"><h3>${p[1]} <span class="tag">需传承 ${p[2]} 点</span></h3><p>${p[3]}</p><button class="primary" ${ok?'':'disabled'} onclick="pickPerk('${p[0]}')">选择这项优势</button></div>`}).join('')}`,'<button onclick="closeDlg()">白手起家，不用优势</button>',{noClose:true,onCancel:closeDlg});
}
function pickPerk(id){
  let p=PERKS.find(x=>x[0]===id);if(!p||!S)return;
  if(id==='fund')S.money+=400000;if(id==='brand'){S.fame+=3;S.fans+=600}if(id==='tech'){S.investments.engine=Math.max(1,S.investments.engine);S.investments.qa=Math.max(1,S.investments.qa)}
  if(id==='network'){if(S.staff.length>=officeDef().cap)S.money+=200000;else{let used=new Set(S.staff.map(x=>x.name)),prof=shuffle(PROFILES).find(x=>!used.has(x[0]));let e=staffFromProfile(prof,2);e.salary=Math.round(e.salary*1.3);S.staff.push(e)}}
  if(id==='kit'){S.items.energy=(S.items.energy||0)+2;S.items.book=(S.items.book||0)+1;S.items.idea=(S.items.idea||0)+1}
  if(id==='codex'){let list=shuffle(GENRES.flatMap(g=>THEMES.map(t=>[g,t]))).filter(([g,t])=>S.unlocked.genres.includes(g)&&S.unlocked.themes.includes(t)).slice(0,6);list.forEach(([g,t])=>S.combos[comboKey(g,t)]={tried:0,best:0,tier:comboTier(g,t),surveyed:true})}
  addNews('创始人传承',`创始人优势「${p[1]}」生效：${p[3]}。`);save();closeDlg();toast(`已获得：${p[1]}`);
}
function continueGame(){let r=rawLoad();if(!r){toast('没有可用的存档。');return}try{S=normalize(r)}catch(e){toast('存档无法读取。');return}if(r._legacy){delete S._legacy;toast('已将 V1.x 存档升级到 V2.0。')}save();showGame()}
function showGame(){

function careerOptions(e){return CAREERS.filter(c=>c.from.includes(e.role))}
function careerHtml(e){
  let opts=careerOptions(e),cur=CAREERS.find(c=>c.id===e.role);
  let path=`<div class="profile-line">职业路线：${[...(e.jobs||[]).map(j=>ROLES[j]?.[0]||j),roleName(e)].join(' → ')}${cur?` · 被动：<b>${cur.passive}</b>`:''}</div>`;
  if(!opts.length)return`<h3>转职</h3>${path}<p class="muted" style="font-size:12px">已是该路线的最高职业。</p>`;
  return`<h3>转职 <span class="tag">转职手册 ×${itemCount('book')}</span></h3>${path}${opts.map(c=>{let ok=e.lvl>=c.minLvl&&itemCount('book')>0&&!e.status,why=e.lvl<c.minLvl?`需 Lv.${c.minLvl}`:itemCount('book')<1?'需转职手册':e.status?'当前有安排':'';return`<div class="choice ${e.lvl<c.minLvl?'dim':''}"><h3>${ROLES[c.id][1]} ${ROLES[c.id][0]} <span class="tag">第 ${c.tier} 阶 · Lv.${c.minLvl}</span></h3><p>${DIMS.filter(k=>c.gain[k]).map(k=>`${DIM_LABEL[k]} +${c.gain[k]}`).join('、')} · ${c.passive}。转职后经验清零、月薪 +15%。</p><button class="primary" ${ok?'':'disabled'} onclick="changeJob(${e.id},'${c.id}')">${ok?'转职':why}</button></div>`}).join('')}`;
}
function changeJob(id,careerId){
  let e=staffById(id),c=CAREERS.find(x=>x.id===careerId);if(!e||!c||!c.from.includes(e.role))return;
  if(e.lvl<c.minLvl)return toast(`需要 Lv.${c.minLvl}。`);if(itemCount('book')<1)return toast('需要一本转职手册（道具商店）。');if(e.status)return toast('请先等 TA 完成当前安排。');
  S.items.book--;e.jobs=e.jobs||[];e.jobs.push(e.role);e.role=c.id;DIMS.forEach(k=>{if(c.gain[k])e.stats[k]=Math.min(STAT_CAP,e.stats[k]+c.gain[k])});e.xp=0;e.salary=Math.round(e.salary*1.15/100)*100;e.color=ROLE_COLOR[c.id];e.mood='走上新岗位';
  if(!e.goalDone&&/技术突破|专精|成熟玩法|录音棚/.test(e.goal||'')){e.goalDone=true;S.fame+=.3;addNews('个人目标',`${e.name} 完成了目标「${e.goal}」。`,e.name)}
  addNews('员工转职',`${e.name} 转职为${ROLES[c.id][0]}。`,e.name);bubble(e.id,'转职！','#ffe18a');save();openPerson(id);
}

function buyItem(id){let d=ITEMS[id];if(!d)return;if(S.money<d.money||S.rp<d.rp)return toast('资金或研发点不足。');S.money-=d.money;S.rp-=d.rp;S.items[id]=itemCount(id)+1;toast(`已购买 ${d.name}。`);save();openShop()}
function openItemPicker(kind,targetId){
  let list=Object.entries(ITEMS).filter(([id,d])=>d.target===kind&&itemCount(id)>0),back=kind==='project'?'closeDlg()':`openPerson(${targetId})`;
  if(!list.length)return openDlg('使用道具','<div class="empty">仓库里没有可用于此处的道具。</div>',`<button onclick="${back}">返回</button><button class="primary" onclick="openShop()">去商店</button>`);
  let p=kind==='project'?projectById(targetId):null;
  openDlg('使用道具',list.map(([id,d])=>{let bad=p&&id==='hype'&&p.stage!=='debug'?'仅调试阶段可用':p&&['code','art','music','idea'].includes(id)&&p.stage==='debug'?'仅开发阶段可用':'';return`<div class="inv-row"><div><h3>${d.ico} ${d.name} <span class="tag">×${itemCount(id)}</span></h3><p>${d.desc}</p></div><button class="primary" ${bad?'disabled':''} onclick="useItem('${id}','${kind}',${JSON.stringify(String(targetId))})">${bad||'使用'}</button></div>`}).join(''),`<button onclick="${back}">返回</button>`);
}
function useItem(id,kind,targetId){
  let d=ITEMS[id];if(!d||itemCount(id)<1)return;
  if(kind==='staff'){let e=staffById(+targetId);if(!e)return closeDlg();
    if(id==='energy'){e.energy=clamp(e.energy+40,0,100);bubble(e.id,'体力 +40','#7dd3b8')}
    if(id==='disc'){let k=ROLES[e.role][2];e.stats[k]=Math.min(STAT_CAP,e.stats[k]+6);bubble(e.id,`${DIM_LABEL[k]} +6`,DIM_COLOR[k])}
    S.items[id]--;addNews('使用道具',`${e.name} 使用了${d.name}。`,e.name);save();return openPerson(e.id)}
  let p=projectById(targetId);if(!p)return closeDlg();
  if(['code','art','music','idea'].includes(id)){if(p.stage==='debug')return toast('仅开发阶段可用。');let v=Math.round(marketExpectation()*.4);p.quality[id]+=v;devLog(p,`使用${d.name}：${DIM_LABEL[id]} +${v}`);teamOf(p).slice(0,1).forEach(e=>bubble(e.id,`${DIM_LABEL[id]} +${v}`,DIM_COLOR[id]))}
  if(id==='debug'){let cut=Math.min(p.bugs,6);p.bugs-=cut;devLog(p,`除虫喷雾：Bug -${cut}`)}
  if(id==='hype'){if(p.stage!=='debug')return toast('仅调试阶段可用。');p.hype=(p.hype||0)+.12;devLog(p,'炒作通稿已发出：首发销量 +12%')}
  S.items[id]--;addNews('使用道具',`《${p.name}》使用了${d.name}。`,p.name);save();closeDlg();
}

  let tired=e.energy<35,walk=Math.round(Math.sin(t*2+px)),color=e.color||ROLE_COLOR[e.role];
  x.fillStyle='#253048';x.fillRect(px-6,py+5+walk,5,9);x.fillRect(px+2,py+5-walk,5,9);x.fillStyle='#1b2438';x.fillRect(px-7,py+13+walk,6,3);x.fillRect(px+2,py+13-walk,6,3);
  x.fillStyle=color;x.fillRect(px-8,py-8,17,14);x.fillStyle='#f0b98e';x.fillRect(px-6,py-18,13,11);x.fillStyle='#3c2e36';x.fillRect(px-7,py-20,15,5);x.fillRect(px-7,py-17,3,4);x.fillStyle='#273044';x.fillRect(px-3,py-14,2,2);x.fillRect(px+3,py-14,2,2);
  if(tired){x.fillStyle='#6d5b79';x.fillRect(px-9,py-10,19,4)}
  if(e.status?.kind==='project'){x.fillStyle='#fff0a3';x.fillRect(px+11,py-8,7,7);x.fillStyle='#865b34';x.fillRect(px+13,py-6,3,3)}
  if(e.status?.kind==='maintenance'){x.fillStyle='#e75e68';x.fillRect(px+11,py-8,8,8);x.fillStyle='#fff';x.fillRect(px+14,py-6,2,4)}
  if(e.status?.kind==='train'){x.fillStyle='#8fd0ff';x.fillRect(px+11,py-10,8,10);x.fillStyle='#2b4d78';x.fillRect(px+13,py-8,4,1);x.fillRect(px+13,py-5,4,1)}
  if(e.status?.kind==='outsource'){x.fillStyle='#d6a94b';x.fillRect(px+11,py-8,8,8);x.fillStyle='#3a2a08';x.fillText('¥',px+12,py-1)}
  if(e.energy<15){x.fillStyle='#e85e6b';x.fillRect(px-10,py-27,20,4)}
  x.save();x.font='bold 9px "PingFang SC",sans-serif';x.textAlign='center';x.fillStyle='#17243a';x.fillRect(px-18,py-31,36,11);x.fillStyle='#fff7d7';x.fillText(e.name.slice(0,4),px,py-23);x.restore();
}
function drawOffice(){
  let c=byId('officeCanvas');if(!c||!S)return;let x=c.getContext('2d'),W=480,H=280,lvl=S.office,t=performance.now()/170,now=performance.now();
  x.imageSmoothingEnabled=false;x.clearRect(0,0,W,H);x.fillStyle=['#d8c69e','#c8dbd8','#c9d5e1','#192845'][lvl];x.fillRect(0,0,W,H);x.fillStyle=lvl===3?'#253861':'#f6e9c8';x.fillRect(12,16,W-24,H-28);x.fillStyle='#b99d72';for(let i=18;i<W-20;i+=24)x.fillRect(i,15,2,H-26);for(let j=18;j<H-16;j+=22)x.fillRect(13,j,W-26,2);
  drawRoom(x,lvl);
  S.staff.slice(0,officeDef().cap).forEach((e,i)=>{let pos=employeePos(e,i,t);drawEmployee(x,e,pos.x,pos.y,t)});
  let main=primaryProject();
  if(main?.stage==='debug'){x.fillStyle='#e64b52';x.fillRect(218,34,44,16);x.fillStyle='#fff';x.fillRect(238,37,4,9);x.fillRect(238,48,4,3)}
  else if(main?.sceneEvent==='idea'){x.fillStyle='#ffe066';x.fillRect(232,42,11,12);x.fillRect(230,46,15,5);x.fillStyle='#f49b42';x.fillRect(234,54,7,3)}
  if(!main){x.fillStyle='#29466f';x.fillRect(161,42,155,19);x.fillStyle='#fff';x.font='10px sans-serif';x.fillText('没有项目 · 自主学习日',177,55)}
  /* 飘字 */
  for(let i=FX.length-1;i>=0;i--){let f=FX[i],k=(now-f.t0)/f.life;if(k>=1){FX.splice(i,1);continue}
    x.save();x.globalAlpha=k<.7?1:1-(k-.7)/.3;x.font=`bold ${f.big?12:11}px "PingFang SC",sans-serif`;x.textAlign='center';let y=f.y-k*26;
    x.lineWidth=3;x.strokeStyle='#1a1d2b';x.strokeText(f.text,f.x,y);x.fillStyle=f.color;x.fillText(f.text,f.x,y);x.restore()}
}
function bindOfficeClick(){let c=byId('officeCanvas');if(!c||c.dataset.bound)return;c.dataset.bound='1';c.onclick=ev=>{let r=c.getBoundingClientRect(),px=(ev.clientX-r.left)*480/r.width,py=(ev.clientY-r.top)*280/r.height,closest=null,dist=1e9;S.staff.slice(0,officeDef().cap).forEach((e,i)=>{let p=employeePos(e,i,performance.now()/170),d=(p.x-px)**2+(p.y-py)**2;if(d<dist){dist=d;closest=e}});if(closest&&dist<2800)openPerson(closest.id)}}
function startScene(){if(sceneStarted)return;sceneStarted=true;let loop=()=>{if(!document.hidden&&S&&activePage==='home'&&(speed>0||FX.length))drawOffice();setTimeout(()=>requestAnimationFrame(loop),FX.length?40:250)};requestAnimationFrame(loop)}

/* ---------- 启动 ---------- */
document.addEventListener('DOMContentLoaded',()=>{checkContinue();updateSpeedUI()});
</script>
